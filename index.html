<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notenrechner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Notenrechner</h1>

    <div class="mode-toggle">
      <button class="mode-btn active" data-mode="single">Einzelberechnung</button>
      <button class="mode-btn" data-mode="class">Klassendurchschnitt</button>
    </div>

    <div id="single-mode" class="mode-section">
      <div class="input-group">
        <label for="totalPoints">Zu erreichende Gesamtpunktzahl</label>
        <input type="number" id="totalPoints" min="1" step="any" placeholder="z. B. 100">
      </div>
      <div class="input-group">
        <label for="achievedPoints">Erreichte Punkte</label>
        <input type="number" id="achievedPoints" min="0" step="any" placeholder="z. B. 85">
      </div>
      <div class="output">
        <div class="result-item">
          <span class="label">Erreichte Prozent</span>
          <span class="value" id="percentage">—</span>
        </div>
        <div class="result-item">
          <span class="label">Note</span>
          <span class="value grade" id="grade">—</span>
        </div>
      </div>
    </div>

    <div id="class-mode" class="mode-section" hidden>
      <div class="class-inputs">
        <div class="input-group">
          <label for="classTotalPoints">Gesamtpunktzahl (für alle)</label>
          <input type="number" id="classTotalPoints" min="1" step="any" placeholder="z. B. 100">
        </div>
        <div class="input-row">
          <div class="input-group flex-name">
            <label for="studentName">Name</label>
            <input type="text" id="studentName" placeholder="z. B. Max (optional, sonst Nr.)">
          </div>
          <div class="input-group flex-points">
            <label for="studentAchieved">Erreichte Punkte</label>
            <input type="number" id="studentAchieved" min="0" step="any" placeholder="85">
          </div>
          <button id="addEntryBtn" class="btn">+</button>
        </div>
      </div>

      <div id="ambiguity-picker" class="ambiguity-picker" hidden>
        <p>Nicht eindeutig — bitte Note auswählen:</p>
        <div id="ambiguity-options" class="ambiguity-options"></div>
        <div class="ambiguity-buttons">
          <button id="ambiguity-confirm" class="btn btn-sm">Bestätigen</button>
          <button id="ambiguity-cancel" class="btn btn-sm btn-outline">Abbrechen</button>
        </div>
      </div>

      <div class="class-entries">
        <h3>Alle Noten</h3>
        <div id="entries-list"></div>
      </div>

      <div class="class-average">
        <span class="label">Klassendurchschnitt</span>
        <span class="value" id="averageDisplay">—</span>
      </div>
    </div>

    <div class="grade-table">
      <h2>Notenspiegel</h2>
      <table id="grade-table"></table>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
